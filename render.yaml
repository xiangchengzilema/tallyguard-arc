services:
  - type: web
    name: tallyguard-arc
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: TALLYGUARD_MODE
        value: simulation
      - key: TALLYGUARD_ARC_NETWORK
        value: ARC-TESTNET
      - key: TALLYGUARD_ALLOW_MAINNET
        value: "false"
      - key: TALLYGUARD_MAX_TRANSFER_USDC
        value: "5.00"
      - key: TALLYGUARD_ENABLE_DEMO_SESSIONS
        value: "true"
      - key: TALLYGUARD_RATE_LIMIT_PER_MINUTE
        value: "6000"
      - key: TALLYGUARD_DEMO_SESSION_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: TALLYGUARD_MAX_ACTIVE_SESSIONS_PER_PRINCIPAL
        value: "32"
      - key: TALLYGUARD_MAX_EVIDENCE_BYTES
        value: "10485760"
      - key: TALLYGUARD_REQUEST_LOGS
        value: "true"
      - key: TALLYGUARD_DATABASE_PATH
        value: /tmp/tallyguard.sqlite3
      - key: TALLYGUARD_FRONTEND_DIST
        value: /app/web/dist
