name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: pip install -e ".[circle,dev]"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Test frontend upload and correction workflows
        working-directory: web
        run: npm test

      - name: Run Python tests
        run: python -m pytest

      - name: Run real-HTTP deployment smoke
        run: tallyguard-deployment-smoke --output /tmp/tallyguard-deployment-smoke.json

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Audit release artifacts and full Git history
        run: tallyguard-release-audit --output /tmp/tallyguard-release-audit.json
