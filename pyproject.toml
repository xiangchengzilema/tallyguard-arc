[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tallyguard-arc"
version = "0.1.0"
description = "Evidence-bound autonomous accounts payable on Arc"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TallyGuard contributors" }]
dependencies = [
  "Flask>=3.0,<4",
]

[project.scripts]
tallyguard-api = "tallyguard.api:main"

[project.optional-dependencies]
circle = [
  "circle-developer-controlled-wallets==9.6.0",
]
dev = [
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
